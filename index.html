<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Manuel Adame</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Inter:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;background:#FAFAF8;color:#111;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--surface2:#F4F4F1;
  --ink:#111111;--ink2:#555555;--ink3:#AAAAAA;
  --line:#E8E8E4;--line2:#F0F0EC;
  --green:#1E6B45;--green-t:rgba(30,107,69,.1);
  --amber:#8A5C00;--amber-t:rgba(138,92,0,.1);
  --red:#B91C1C;--red-t:rgba(185,28,28,.08);
  --r:18px;--rm:12px;
}
.app{max-width:430px;margin:0 auto;padding-bottom:80px}
.hdr{padding:52px 28px 0}
.hdr-eye{font-size:9px;font-weight:500;letter-spacing:.24em;color:var(--ink3);text-transform:uppercase;margin-bottom:12px}
.hdr-title{font-family:'Big Shoulders Display',sans-serif;font-size:56px;font-weight:900;color:var(--ink);line-height:.9;letter-spacing:-.01em;text-transform:uppercase}
.rule{height:.5px;background:var(--line);margin:28px 28px 0}
.clock-section{padding:32px 28px 24px;display:flex;flex-direction:column;align-items:center}
.clock-tag{font-size:9px;font-weight:500;letter-spacing:.2em;color:var(--ink3);text-transform:uppercase;margin-bottom:18px}
.clock-digits{font-family:'Share Tech Mono',monospace;font-size:76px;font-weight:400;color:var(--ink);line-height:1;letter-spacing:.04em;font-variant-numeric:tabular-nums;transition:color .3s}
.clock-digits.late{color:var(--red)}
.clock-ampm{font-family:'Inter',sans-serif;font-size:15px;font-weight:300;color:var(--ink3);margin-left:10px;vertical-align:middle;letter-spacing:.06em}
.clock-date{font-size:11px;font-weight:300;color:var(--ink3);margin-top:12px;letter-spacing:.06em}
.prog-wrap{padding:0 28px 28px;display:flex;align-items:center;gap:14px}
.prog-track{flex:1;height:1px;background:var(--line);position:relative;overflow:visible}
.prog-fill{position:absolute;top:0;left:0;height:100%;background:var(--ink);transition:width .55s cubic-bezier(.4,0,.2,1)}
.prog-fill.mid{background:var(--amber)}
.prog-fill.low{background:var(--ink3)}
.prog-lbl{font-size:10px;font-weight:400;color:var(--ink3);white-space:nowrap;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.toggle-wrap{padding:0 28px 32px}
.toggle-pill{display:flex;background:var(--surface2);border:0.5px solid var(--line);border-radius:50px;padding:3px;position:relative}
.toggle-thumb{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);background:var(--ink);border-radius:46px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.toggle-thumb.right{transform:translateX(calc(100%))}
.toggle-opt{flex:1;text-align:center;padding:11px 0;font-size:12px;font-weight:500;color:var(--ink3);border-radius:46px;cursor:pointer;transition:color .22s;position:relative;z-index:1;user-select:none;letter-spacing:.02em}
.toggle-opt.active{color:#fff}
.view{padding:0 28px 40px}
.view.hidden{display:none}
.sec-lbl{font-size:9px;font-weight:500;letter-spacing:.22em;color:var(--ink3);text-transform:uppercase;margin-bottom:16px;padding-left:1px;display:flex;align-items:center;gap:10px}
.sec-lbl::after{content:'';flex:1;height:.5px;background:var(--line)}

/* Day loading banner */
.day-load-banner{background:var(--surface2);border:0.5px solid var(--line);border-radius:var(--rm);padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:10px;font-size:11px;font-weight:300;color:var(--ink3);letter-spacing:.04em}
.day-load-banner .spin{width:14px;height:14px;border-width:1px;flex-shrink:0}
.day-load-banner.done{display:none}

.act-list{display:flex;flex-direction:column;gap:8px}
.act-card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.act-card.done{border-color:#AADBC0;box-shadow:0 0 0 3px rgba(30,107,69,.04)}
.act-card.weekly-tag{border-style:dashed}
.act-card:active{transform:scale(.995)}
.act-row{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;transition:background .15s;user-select:none;-webkit-user-select:none}
.act-row:active{background:var(--surface2)}
.act-ico{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .25s}
.act-ico svg{width:17px;height:17px;stroke:var(--ink3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.act-card.done .act-ico{background:#EAF4EE}
.act-card.done .act-ico svg{stroke:var(--green)}
.act-name{flex:1;min-width:0}
.act-name-main{font-size:14px;font-weight:400;color:var(--ink2);letter-spacing:.01em;transition:color .25s;display:block}
.act-card.done .act-name-main{color:var(--green)}
.act-name-sub{font-size:10px;font-weight:300;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;display:block;margin-top:1px}
.act-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.act-pill{font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;transition:all .22s;white-space:nowrap;letter-spacing:.04em}
.pill-done{background:#EAF4EE;color:var(--green);border:0.5px solid #AADBC0}
.pill-pend{background:var(--surface2);color:var(--ink3);border:0.5px solid var(--line)}
.act-chev{width:14px;height:14px;flex-shrink:0;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.act-chev svg{width:14px;height:14px;stroke:#D0D0D0;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.act-chev.open{transform:rotate(180deg)}
.act-body{max-height:0;overflow:hidden;transition:max-height .38s cubic-bezier(.4,0,.2,1)}
.act-body.open{max-height:660px}
.act-inner{padding:0 20px 20px;border-top:0.5px solid var(--line)}
.upl-zone{margin-top:16px;border:1px dashed var(--line);border-radius:var(--rm);padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:border-color .2s,background .2s;text-align:center}
.upl-zone:hover,.upl-zone:active{border-color:var(--ink3);background:var(--surface2)}
.upl-zone svg{width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.upl-t{font-size:12px;font-weight:500;color:var(--ink2)}
.upl-s{font-size:10px;font-weight:300;color:var(--ink3);letter-spacing:.04em}
.fi{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.th-w{position:relative}
.th-img{width:68px;height:68px;border-radius:8px;object-fit:cover;border:0.5px solid var(--line);display:block}
.th-del{position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--ink);border:1.5px solid var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.th-del:active{transform:scale(.88)}
.th-del svg{width:9px;height:9px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.upl-spin{font-size:10px;font-weight:300;color:var(--ink3);margin-top:8px;display:none;letter-spacing:.06em}
.upl-spin.on{display:block}
.act-note-ta{width:100%;margin-top:12px;padding:12px 14px;border:0.5px solid var(--line);border-radius:10px;font-size:13px;font-family:'Inter',inherit;font-weight:300;resize:none;min-height:56px;color:var(--ink);background:transparent;outline:none;transition:border-color .2s;line-height:1.55}
.act-note-ta:focus{border-color:#888}
.send-btn{display:none;width:100%;margin-top:12px;padding:14px;border-radius:50px;background:var(--ink);color:#fff;border:none;font-size:12px;font-weight:500;cursor:pointer;transition:opacity .2s,transform .15s;letter-spacing:.06em;text-transform:uppercase;align-items:center;justify-content:center;gap:8px}
.send-btn.on{display:flex}
.send-btn:hover{opacity:.82}
.send-btn:active{transform:scale(.97)}
.send-btn.sent{background:var(--green)}
.send-btn svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* Artist name field */
.artist-name-wrap{margin-top:16px}
.artist-name-lbl{font-size:9px;font-weight:500;letter-spacing:.18em;color:var(--ink3);text-transform:uppercase;margin-bottom:6px;padding-left:1px}
.artist-inp{width:100%;padding:11px 14px;border:0.5px solid var(--line);border-radius:10px;font-size:13px;font-family:'Inter',inherit;font-weight:300;color:var(--ink);background:transparent;outline:none;transition:border-color .2s;letter-spacing:.01em}
.artist-inp:focus{border-color:#888}
.artist-inp::placeholder{color:var(--ink3)}

/* Weekly badge */
.weekly-badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:500;letter-spacing:.1em;color:var(--amber);text-transform:uppercase;background:var(--amber-t);border:0.5px solid rgba(138,92,0,.2);border-radius:20px;padding:2px 8px;margin-bottom:10px}
.weekly-badge svg{width:10px;height:10px;stroke:var(--amber);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.daynote-card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.daynote-ta{width:100%;padding:18px 20px;border:none;font-size:13px;font-family:'Inter',inherit;font-weight:300;color:var(--ink);background:transparent;resize:none;min-height:96px;outline:none;line-height:1.65}
.daynote-ta::placeholder{color:var(--ink3)}
.daynote-foot{padding:12px 20px;border-top:0.5px solid var(--line);display:flex;justify-content:flex-end}
.daynote-btn{padding:10px 24px;border-radius:50px;background:var(--ink);color:#fff;border:none;font-size:11px;font-weight:500;cursor:pointer;transition:opacity .2s,transform .15s;letter-spacing:.08em;text-transform:uppercase}
.daynote-btn:active{transform:scale(.97)}
.daynote-btn.ok{background:var(--green)}

/* Calendar */
.cal-head-w{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.cal-nav{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--surface2);cursor:pointer;transition:background .2s}
.cal-nav:active{transform:scale(.95)}
.cal-nav svg{width:16px;height:16px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-head{font-family:'Big Shoulders Display',sans-serif;font-size:32px;font-weight:900;color:var(--ink);letter-spacing:-.01em;text-transform:uppercase}
.cal-card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--r);padding:20px}
.cal-g{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cal-dow{text-align:center;font-size:8px;font-weight:600;letter-spacing:.1em;color:var(--ink3);padding-bottom:10px;text-transform:uppercase}
.cal-d{aspect-ratio:1;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;border:0.5px solid transparent;transition:all .18s;font-variant-numeric:tabular-nums;color:var(--ink2)}
.cal-d:not(.emp):not(.fut):hover{border-color:var(--ink3);transform:scale(1.08)}
.cal-d:not(.emp):not(.fut):active{transform:scale(.95)}
.cal-d.today{border-color:var(--ink)!important;font-weight:600;color:var(--ink)!important}
.cal-d.green{background:#EAF4EE;color:var(--green)}
.cal-d.amber{background:#FDF4DC;color:var(--amber)}
.cal-d.red{background:#FEF2F1;color:var(--red)}
.cal-d.nodata{color:var(--line)}
.cal-d.fut{color:var(--line);cursor:default}
.cal-d.emp{cursor:default}
.cal-w-sum{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--ink3);background:var(--bg);border:0.5px dashed var(--line);cursor:default;gap:1px}
.cal-w-sum svg{width:10px;height:10px;stroke:var(--ink3)}
.cal-legend{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.leg{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:400;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}
.leg-d{width:6px;height:6px;border-radius:2px}

/* Range analysis */
.range-section{margin-top:28px}
.range-card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.range-head{padding:18px 20px;border-bottom:0.5px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.range-head-lbl{font-size:11px;font-weight:500;color:var(--ink2);letter-spacing:.04em}
.range-inputs{padding:16px 20px;display:flex;gap:10px;border-bottom:0.5px solid var(--line);align-items:center}
.range-inp-wrap{flex:1}
.range-inp-lbl{font-size:9px;font-weight:500;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin-bottom:5px}
.range-inp{width:100%;padding:10px 12px;border:0.5px solid var(--line);border-radius:10px;font-size:12px;font-family:'Inter',inherit;font-weight:300;color:var(--ink);background:transparent;outline:none;transition:border-color .2s}
.range-inp:focus{border-color:#888}
.range-btn{padding:10px 18px;border-radius:50px;background:var(--ink);color:#fff;border:none;font-size:11px;font-weight:500;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transition:opacity .2s,transform .15s;align-self:flex-end}
.range-btn:active{transform:scale(.97)}
.range-btn:disabled{opacity:.4;cursor:default}

/* Stats panel */
.stats-wrap{padding:20px}
.stats-loader{display:flex;align-items:center;gap:10px;padding:24px 20px;font-size:11px;font-weight:300;color:var(--ink3);letter-spacing:.06em}
.stats-loader .spin{width:16px;height:16px;border-width:1px;flex-shrink:0}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--surface2);border-radius:var(--rm);padding:14px 16px}
.stat-box.full{grid-column:1/-1}
.stat-val{font-family:'Big Shoulders Display',sans-serif;font-size:36px;font-weight:900;color:var(--ink);line-height:1;letter-spacing:-.01em}
.stat-val.green{color:var(--green)}
.stat-val.amber{color:var(--amber)}
.stat-val.red{color:var(--red)}
.stat-lbl{font-size:9px;font-weight:500;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin-top:4px}
.stat-bar-wrap{margin-top:10px;height:2px;background:var(--line);border-radius:1px;overflow:hidden}
.stat-bar{height:100%;border-radius:1px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.miss-list{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.miss-row{display:flex;align-items:center;gap:10px}
.miss-name{flex:1;font-size:11px;font-weight:300;color:var(--ink2);letter-spacing:.02em}
.miss-pct{font-size:11px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;white-space:nowrap}
.miss-bar-wrap{width:80px;height:3px;background:var(--line);border-radius:1px;overflow:hidden}
.miss-bar{height:100%;background:var(--red);border-radius:1px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.streak-dots{display:flex;gap:3px;margin-top:10px;flex-wrap:wrap}
.s-dot{width:10px;height:10px;border-radius:3px;background:var(--line)}
.s-dot.g{background:#AADBC0}
.s-dot.a{background:#E8C96A}
.s-dot.r{background:#F5A5A5}

/* Loader */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0;gap:16px}
.spin{width:22px;height:22px;border:1px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.load-t{font-size:10px;font-weight:300;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase}

/* Detail view */
.det-wrap{display:none}
.det-wrap.on{display:block}
.det-back{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:300;color:var(--ink3);cursor:pointer;margin-bottom:20px;padding:4px 0;transition:color .18s;letter-spacing:.04em}
.det-back:hover{color:var(--ink)}
.det-back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.det-date{font-family:'Big Shoulders Display',sans-serif;font-size:36px;font-weight:900;color:var(--ink);text-transform:uppercase;letter-spacing:-.01em;margin-bottom:4px}
.det-sub{font-size:11px;font-weight:300;color:var(--ink3);margin-bottom:20px;letter-spacing:.04em}
.det-card{background:var(--surface);border:0.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.det-row{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:0.5px solid var(--line2)}
.det-row:last-child{border-bottom:none}
.det-ico{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.det-ico svg{width:13px;height:13px;stroke:var(--ink3);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.det-name{flex:1;font-size:12px;font-weight:400;color:var(--ink2);letter-spacing:.01em}
.det-pill{font-size:10px;font-weight:500;padding:3px 10px;border-radius:20px;letter-spacing:.04em}
.det-pill.y{background:#EAF4EE;color:var(--green);border:0.5px solid #AADBC0}
.det-pill.n{background:var(--surface2);color:var(--ink3);border:0.5px solid var(--line)}
.det-files{padding:10px 20px 16px 60px;display:flex;flex-wrap:wrap;gap:8px;border-bottom:0.5px solid var(--line2)}
.det-files:last-child{border-bottom:none}
.det-thumb-a{display:block;width:60px;height:60px;border-radius:8px;overflow:hidden;border:0.5px solid var(--line);transition:transform .2s;background:var(--surface2)}
.det-thumb-a:active{transform:scale(.95)}
.det-thumb-img{width:100%;height:100%;object-fit:cover}
.det-note{margin-top:14px;padding:16px;background:var(--surface2);border-radius:var(--rm);font-size:12px;font-weight:300;color:var(--ink2);line-height:1.7;letter-spacing:.02em}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:11px 24px;border-radius:50px;font-size:11px;font-weight:500;opacity:0;transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap;z-index:999;letter-spacing:.06em;text-transform:uppercase}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
  <div class="hdr-eye">Proyecto artístico · 2026</div>
  <div class="hdr-title">Manuel<br>Adame</div>
</div>
<div class="rule"></div>
<div class="clock-section">
  <div class="clock-tag">Hora · México Centro</div>
  <div class="clock-digits" id="clk">00:00<span class="clock-ampm" id="clk-ap">AM</span></div>
  <div class="clock-date" id="clk-date"></div>
</div>
<div class="prog-wrap">
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-lbl" id="prog-lbl">0 · 10</div>
</div>
<div class="toggle-wrap">
  <div class="toggle-pill">
    <div class="toggle-thumb" id="t-thumb"></div>
    <div class="toggle-opt active" id="o-sub" onclick="sw('sub')">Subir actividad</div>
    <div class="toggle-opt" id="o-his" onclick="sw('his')">Consultar historial</div>
  </div>
</div>

<!-- SUBIR VIEW -->
<div class="view" id="v-sub">
  <div class="day-load-banner" id="day-banner">
    <div class="spin"></div>
    Cargando registro del día...
  </div>
  <div class="sec-lbl">Actividades del día</div>
  <div class="act-list" id="act-list"></div>
  <div class="sec-lbl" style="margin-top:32px">Nota del día</div>
  <div class="daynote-card">
    <textarea class="daynote-ta" id="day-note" placeholder="Observaciones, cambios o contexto del día..."></textarea>
    <div class="daynote-foot">
      <button class="daynote-btn" id="note-btn" onclick="saveNote()">Guardar</button>
    </div>
  </div>
</div>

<!-- HISTORIAL VIEW -->
<div class="view hidden" id="v-his">
  <div id="ld" class="loader"><div class="spin"></div><div class="load-t">Consultando registros</div></div>
  <div id="cal-sec" style="display:none">
    <div class="cal-head-w">
      <div class="cal-nav" onclick="chMonth(-1)">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="cal-head" id="cal-month-lbl">Mayo 2026</div>
      <div class="cal-nav" onclick="chMonth(1)">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    </div>
    <div class="cal-card">

function progSnapshot(){
  const done=DAILY_IDS.filter(id=>aD[id]?.done).length;

async function loadTodayState(){
  if(dayLoaded) return;
  const y=TODAY.split('-')[0]; const m=TODAY.split('-')[1];
  try{
    const rs=await fetch(WH_GET,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({accion:'consultar_calendario',mes:`${y}-${m}`})});
    const j=await rs.json();
    const data=j.data||j||{};
    const todayInfo=data[TODAY];
    if(todayInfo?.actividades){
      // Hidratar aD con lo que ya se subió hoy
      Object.entries(todayInfo.actividades).forEach(([actId,actData])=>{
        if(!aD[actId]) aD[actId]={done:false,files:[],note:''};
        if(actData.done){
          aD[actId].done=true;
          // Guardar archivos como referencias (solo URLs, no base64 para no resubir)
          aD[actId].files=(actData.archivos||[]).map(f=>({
            url: f.thumbnail||f.url||'',
            driveLink: f.driveLink||'',
            type:'image/jpeg',
            name:'evidencia',
            fromServer:true
          }));
          aD[actId].note=actData.nota||'';
        }
        // Para artistas, restaurar nombre
        if(actData.nombre_artista) aD[actId].artistName=actData.nombre_artista;
      });
      if(todayInfo.nota) document.getElementById('day-note').value=todayInfo.nota;
    }
  } catch(e){
    // Si falla, continúa con estado vacío
  }
  dayLoaded=true;
  document.getElementById('day-banner').className='day-load-banner done';
  buildActs();
  updProg();
}

  rTh(id,aD[id].files);

}

  if(pill){pill.className='act-pill '+(done?'pill-done':'pill-pend');pill.textContent=done?'Listo':'Pendiente';}
}

async function compressImage(file){
  return new Promise((resolve)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width; let h=img.height; const max=1200;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        const cvs=document.createElement('canvas');
        cvs.width=w;cvs.height=h;
        const ctx=cvs.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(cvs.toDataURL('image/jpeg',.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function onFiles(id,input){
  if(!aD[id]) aD[id]={done:false,files:[],note:''};
  // Filtrar solo los archivos nuevos (no fromServer) para contar slots
  const newFiles=aD[id].files.filter(f=>!f.fromServer);
  const slots=3-newFiles.length;
  if(slots<=0){toast('Máximo 3 archivos nuevos',true);return;}
  const picked=Array.from(input.files).slice(0,slots);
  document.getElementById('sp-'+id).className='upl-spin on';
  for(const f of picked){
    if(!f.type.startsWith('image/')){toast('Solo imágenes',true);continue;}
    const b64=await compressImage(f);
    aD[id].files.push({url:b64,type:'image/jpeg',name:f.name});
  }
  aD[id].done=true;
  markCard(id,true);
  document.getElementById('sb-'+id).className='send-btn on';
  document.getElementById('sp-'+id).className='upl-spin';
  rTh(id,aD[id].files);
  updProg();
  input.value='';
}

function pN(id){
  if(!aD[id]) aD[id]={done:false,files:[],note:''};
  aD[id].note=document.getElementById('n-'+id)?.value||'';
}

async function sendAct(id){
  if(sending[id]) return;
  sending[id]=true;
  pN(id);
  const btn=document.getElementById('sb-'+id);
  btn.innerHTML=ic('check',13,13)+' Enviando...';
  btn.className='send-btn on';
  btn.disabled=true;
  // Solo enviar archivos nuevos (no los que ya están en servidor)
  const archivos=(aD[id].files||[]).filter(f=>!f.fromServer).map(f=>({url:f.url,type:f.type,name:f.name}));
  try{
    await dispatch('guardar_actividad',{
      tipo_de_actividad:slugAct(id),
      nota:aD[id].note||'',
      archivos,
      cantidad_archivos:archivos.length,
      tipos_archivos:archivos.map(f=>f.type)
    });
    btn.innerHTML=ic('check',13,13)+' Enviado';
    btn.className='send-btn on sent';
    aD[id].done=true; markCard(id,true);
    toast('Registro enviado');
  } catch(e){
    toast('Sin conexión',true);
  } finally {
    btn.disabled=false;
    setTimeout(()=>{btn.innerHTML=ic('send',13,13)+' Enviar registro';btn.className='send-btn on';sending[id]=false;},2800);
  }
}

  pN(id);
  const nombre=document.getElementById('aname-'+id)?.value.trim()||'';
  if(!aD[id]) aD[id]={done:false,files:[],note:''};
  aD[id].artistName=nombre;
  const btn=document.getElementById('sb-'+id);
  btn.innerHTML=ic('check',13,13)+' Enviando...';
  btn.className='send-btn on';
  btn.disabled=true;
  const archivos=(aD[id].files||[]).filter(f=>!f.fromServer).map(f=>({url:f.url,type:f.type,name:f.name}));
  try{
    await dispatch('guardar_artista',{
      tipo_de_actividad:slugAct(id),
      nombre_artista:nombre,
      numero_artista:ACTS.find(a=>a.id===id)?.artistNum||0,
      nota:aD[id].note||'',
      archivos,
      cantidad_archivos:archivos.length,
      es_semanal:true
    });
    if(nombre){aD[id].done=true;markCard(id,true);}
    btn.innerHTML=ic('check',13,13)+' Enviado';
    btn.className='send-btn on sent';
    toast('Artista guardado');
  } catch(e){
    toast('Sin conexión',true);
  } finally {
    btn.disabled=false;
    setTimeout(()=>{btn.innerHTML=ic('send',13,13)+' Enviar registro';btn.className='send-btn on';sending[id]=false;},2800);
  }
}

// ── CALENDARIO ───────────────────────────────────────────
function chMonth(offset){currentCalDate.setMonth(currentCalDate.getMonth()+offset);loadCal();}

async function loadCal(){
  const y=currentCalDate.getFullYear();
  const m=String(currentCalDate.getMonth()+1).padStart(2,'0');
  const targetMonth=`${y}-${m}`;
  const monthsLbl=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('cal-month-lbl').textContent=`${monthsLbl[currentCalDate.getMonth()]} ${y}`;
  document.getElementById('ld').style.display='flex';
  document.getElementById('cal-sec').style.display='none';
  document.getElementById('det').className='det-wrap';
  try{
    const rs=await fetch(WH_GET,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'consultar_calendario',mes:targetMonth})});
    const j=await rs.json();
    calD=j.data||j||{};
  } catch(e){calD={};}
  document.getElementById('ld').style.display='none';
  document.getElementById('cal-sec').style.display='block';
  renderCal();
  // Precargar rango con mes actual
  const fd=`${y}-${m}-01`;
  const ld=new Date(y,currentCalDate.getMonth()+1,0);
  const ldStr=`${y}-${m}-${String(ld.getDate()).padStart(2,'0')}`;
  if(!document.getElementById('range-from').value) document.getElementById('range-from').value=fd;
  if(!document.getElementById('range-to').value) document.getElementById('range-to').value=ldStr>TODAY?TODAY:ldStr;
}

function renderCal(){
  const g=document.getElementById('cal-g');
  g.innerHTML='';
  ['D','L','M','X','J','V','S','🎨'].forEach(d=>{
    const el=document.createElement('div');el.className='cal-dow';el.textContent=d;g.appendChild(el);
  });
  const year=currentCalDate.getFullYear();
  const month=currentCalDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  for(let i=0;i<firstDay;i++){const el=document.createElement('div');el.className='cal-d emp';g.appendChild(el);}
  const isCurrentMonth=TODAY.startsWith(`${year}-${String(month+1).padStart(2,'0')}`);
  const todayDate=parseInt(TODAY.split('-')[2]);
  let weekArtist=0; let dow=firstDay;
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div');
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const info=calD[ds];
    const isT=isCurrentMonth&&d===todayDate;
    const isFut=(isCurrentMonth&&d>todayDate)||((!isCurrentMonth)&&currentCalDate>new Date(TODAY));
    let cls='cal-d';
    if(isFut) cls+=' fut';
    else if(info){
      const p=info.progreso_completadas||0;
      if(p===10)cls+=' green'; else if(p>=6)cls+=' amber'; else if(p>=1)cls+=' red'; else cls+=' nodata';
    } else cls+=' nodata';
    if(isT) cls+=' today';
    el.className=cls; el.textContent=d;
    if(!isFut) el.onclick=()=>openDet(ds,info);
    g.appendChild(el);
    if(info?.cantidad_artistas) weekArtist+=info.cantidad_artistas;
    dow++;
    if(dow===7||d===daysInMonth){
      if(d===daysInMonth&&dow<7){for(let j=dow;j<7;j++){const e=document.createElement('div');e.className='cal-d emp';g.appendChild(e);}}
      const s=document.createElement('div');s.className='cal-w-sum';
      s.innerHTML=`${ic('user',10,10)}<span>${weekArtist}</span>`;
      g.appendChild(s);
      weekArtist=0;dow=0;
    }
  }
}

function openDet(ds,info){
  document.getElementById('cal-sec').style.display='none';
  const months=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const[,mo,d]=ds.split('-');
  const lbl=`${parseInt(d)} ${months[parseInt(mo)-1]}`;
  let html=`<div class="det-back" onclick="closeDet()">${ic('back',14,14)} Volver</div>`;
  html+=`<div class="det-date">${lbl}</div>`;
  if(info){
    const artCount=info.cantidad_artistas||
      (info.actividades?Object.keys(info.actividades).filter(k=>k.startsWith('artista')&&info.actividades[k]?.done).length:0);
    html+=`<div class="det-sub">${info.progreso_completadas||0} de ${info.progreso_total||10} completadas · ${artCount} artistas</div>`;
    html+=`<div class="det-card">`;
    ACTS.forEach(a=>{
      const ad=info.actividades?.[a.id];
      const done=ad?.done;
      html+=`<div class="det-row"><div class="det-ico">${ic(a.icon,13,13)}</div><div class="det-name">${a.name}</div><span class="det-pill ${done?'y':'n'}">${done?'Completo':'—'}</span></div>`;
      if(done&&ad.archivos?.length){
        html+=`<div class="det-files">`;
        ad.archivos.forEach(f=>{
          if(f.thumbnail&&f.thumbnail!==''){
            html+=`<a href="${f.driveLink}" target="_blank" class="det-thumb-a"><img src="${f.thumbnail}" class="det-thumb-img" alt="Evidencia"></a>`;
          } else if(f.url){
            html+=`<a href="${f.url}" target="_blank" class="det-thumb-a"><img src="${f.url}" class="det-thumb-img" alt="" onerror="this.src=''"></a>`;
          }
        });
        html+=`</div>`;
      }
    });
    html+=`</div>`;
    if(info.nota) html+=`<div class="det-note"><strong>Nota del día:</strong><br>${escH(info.nota)}</div>`;
  } else {
    html+=`<div class="det-sub" style="padding:28px 0;text-align:center">Sin registro para este día.</div>`;
  }
  const det=document.getElementById('det');
  det.innerHTML=html;det.className='det-wrap on';
}
function closeDet(){
  document.getElementById('det').className='det-wrap';
  document.getElementById('cal-sec').style.display='block';
}

// ── ANÁLISIS POR RANGO ───────────────────────────────────
// Genera lista de meses YYYY-MM entre dos fechas
function monthsBetween(fromStr,toStr){
  const months=[];
  const from=new Date(fromStr+'T00:00:00');
  const to=new Date(toStr+'T00:00:00');
  let cur=new Date(from.getFullYear(),from.getMonth(),1);
  while(cur<=to){
    months.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
    cur.setMonth(cur.getMonth()+1);
  }
  return months;
}

async function runAnalysis(){
  const fromVal=document.getElementById('range-from').value;
  const toVal=document.getElementById('range-to').value;
  if(!fromVal||!toVal){toast('Elige ambas fechas',true);return;}
  if(fromVal>toVal){toast('La fecha inicio debe ser antes del fin',true);return;}
  const panel=document.getElementById('stats-panel');
  panel.innerHTML=`<div class="stats-loader"><div class="spin"></div> Calculando análisis...</div>`;
  document.getElementById('range-btn').disabled=true;
  const months=monthsBetween(fromVal,toVal);
  // Fetch un mes a la vez
  let allData={};
  for(const mes of months){
    try{
      const rs=await fetch(WH_GET,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({accion:'consultar_calendario',mes})});
      const j=await rs.json();
      Object.assign(allData,j.data||j||{});
    } catch(e){}
  }
  document.getElementById('range-btn').disabled=false;
  renderStats(allData,fromVal,toVal);
}

function renderStats(data,from,to){
  // ── helpers de fecha ──────────────────────────────────
  function isSunday(ds){ return new Date(ds+'T12:00:00').getDay()===0; }
  // Número de semana ISO-like dentro del rango: clave "YYYY-Www"
  function weekKey(ds){
    const d=new Date(ds+'T12:00:00');
    // Semana empieza el lunes (ISO)
    const day=d.getDay()||7; // dom→7
    const thu=new Date(d); thu.setDate(d.getDate()-day+4);
    const jan4=new Date(thu.getFullYear(),0,4);
    const wn=1+Math.round((thu-jan4)/604800000);
    return`${thu.getFullYear()}-W${String(wn).padStart(2,'0')}`;
  }

  // ── Todos los días en rango, pasados o hoy ─────────────
  // Para los días sin registro necesitamos conocer qué fechas
  // cayeron dentro del rango aunque no estén en `data`.
  // Construimos el set completo de fechas del rango.
  const allDaysInRange=[];
  {
    let cur=new Date(from+'T12:00:00');
    const end=new Date((to<=TODAY?to:TODAY)+'T12:00:00');
    while(cur<=end){
      allDaysInRange.push(cur.toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'}));
      cur.setDate(cur.getDate()+1);
    }
  }
  if(!allDaysInRange.length){
    document.getElementById('stats-panel').innerHTML=`<div style="padding:20px;font-size:12px;font-weight:300;color:var(--ink3);text-align:center;letter-spacing:.04em">Sin registros en este rango.</div>`;
    return;
  }

  // ── Separar domingos y días hábiles ───────────────────
  const workDays=allDaysInRange.filter(d=>!isSunday(d));  // L-S, contabilizan obligatorio
  const sundays =allDaysInRange.filter(d=> isSunday(d));  // D, opcional

  // ── Stats diarias (solo días L-S) ─────────────────────
  let greenDays=0,amberDays=0,redDays=0,zeroDays=0;
  let totalPct=0,countedDays=0;
  const failCount={};
  DAILY_IDS.forEach(id=>failCount[id]=0);
  let longestStreak=0,curStreak=0;

  workDays.forEach(d=>{
    const info=data[d];
    if(!info){
      // Día sin registro = 0 actividades, cuenta como bajo
      zeroDays++;curStreak=0;
      DAILY_IDS.forEach(id=>failCount[id]++);
      return;
    }
    const p=info.progreso_completadas||0;
    const pct=info.progreso_porcentaje!=null?info.progreso_porcentaje:Math.round(p/10*100);
    totalPct+=pct; countedDays++;
    if(p===10){greenDays++;curStreak++;longestStreak=Math.max(longestStreak,curStreak);}
    else if(p>=6){amberDays++;curStreak=0;}
    else if(p>=1){redDays++;curStreak=0;}
    else{zeroDays++;curStreak=0;}
    DAILY_IDS.forEach(id=>{
      if(!info.actividades?.[id]?.done) failCount[id]++;
    });
  });

  // Domingos: si tienen registro suman a verde/amber/red pero NO penalizan
  sundays.forEach(d=>{
    const info=data[d];
    if(!info) return; // sin registro → ignorar completamente
    const p=info.progreso_completadas||0;
    const pct=info.progreso_porcentaje!=null?info.progreso_porcentaje:Math.round(p/10*100);
    totalPct+=pct; countedDays++;
    if(p===10){greenDays++;curStreak++;longestStreak=Math.max(longestStreak,curStreak);}
    else if(p>=6) amberDays++;
    else if(p>=1) redDays++;
    // No incrementamos zeroDays ni failCount para domingos sin actividad
  });

  const totalDays=workDays.length; // base del denominador = días L-S
  const avgPct=countedDays>0?Math.round(totalPct/countedDays):0;
  const avgColor=avgPct>=90?'green':avgPct>=60?'amber':'red';

  // ── Stats semanales (artistas) ─────────────────────────
  // Agrupar todas las fechas del rango por semana
  const weekMap={}; // weekKey → {artista1:bool, artista2:bool, artista3:bool, totalArtists:n}
  allDaysInRange.forEach(d=>{
    const info=data[d]; if(!info?.actividades) return;
    const wk=weekKey(d);
    if(!weekMap[wk]) weekMap[wk]={artista1:false,artista2:false,artista3:false,total:0};
    ['artista1','artista2','artista3'].forEach(aid=>{
      if(info.actividades[aid]?.done) weekMap[wk][aid]=true;
    });
    weekMap[wk].total+=(info.cantidad_artistas||0);
  });
  const weeks=Object.values(weekMap);
  const totalWeeks=weeks.length||1;
  const totalArtists=allDaysInRange.reduce((s,d)=>s+(data[d]?.cantidad_artistas||0),0);
  const avgArtistsPerWeek=(totalArtists/totalWeeks).toFixed(1);

  // % semanas donde se completó cada slot de artista
  const artistWeekPct={
    artista1:Math.round(weeks.filter(w=>w.artista1).length/totalWeeks*100),
    artista2:Math.round(weeks.filter(w=>w.artista2).length/totalWeeks*100),
    artista3:Math.round(weeks.filter(w=>w.artista3).length/totalWeeks*100),
  };
  // Falla semanal = % semanas donde NO se completó
  const artistFailPct={
    artista1:100-artistWeekPct.artista1,
    artista2:100-artistWeekPct.artista2,
    artista3:100-artistWeekPct.artista3,
  };

  // ── Tabla unificada de fallas (diarias + semanales) ───
  // Diarias: failCount[id]/totalDays*100
  // Semanales: artistFailPct[id]
  // Mezcladas y ordenadas por % falla desc, top 7
  const allFails=[
    ...DAILY_IDS.map(id=>({
      id, name:ACTS.find(a=>a.id===id)?.name||id,
      pct:Math.round(failCount[id]/totalDays*100),
      tag:''
    })),
    {id:'artista1',name:'Artista contactado 1',pct:artistFailPct.artista1,tag:'semanal'},
    {id:'artista2',name:'Artista contactado 2',pct:artistFailPct.artista2,tag:'semanal'},
    {id:'artista3',name:'Artista contactado 3',pct:artistFailPct.artista3,tag:'semanal'},
  ].sort((a,b)=>b.pct-a.pct).slice(0,7);

  // ── Streak dots (últimos 28 días hábiles registrados) ─
  const last28=workDays.slice(-28);
  const dotHtml=last28.map(d=>{
    const info=data[d];
    if(!info) return`<div class="s-dot"></div>`;
    const p=info.progreso_completadas||0;
    const cls=p===10?'g':p>=6?'a':p>=1?'r':'';
    return`<div class="s-dot ${cls}"></div>`;
  }).join('');

  // ── Render ─────────────────────────────────────────────
  const pctPerfect=Math.round(greenDays/totalDays*100);
  document.getElementById('stats-panel').innerHTML=`
    <div class="stats-wrap">
      <div class="stats-grid">

        <div class="stat-box">
          <div class="stat-val ${avgColor}">${avgPct}%</div>
          <div class="stat-lbl">Promedio completado</div>
          <div class="stat-bar-wrap"><div class="stat-bar" style="width:${avgPct}%;background:${avgColor==='green'?'var(--green)':avgColor==='amber'?'var(--amber)':'var(--red)'}"></div></div>
        </div>

        <div class="stat-box">
          <div class="stat-val">${totalDays}</div>
          <div class="stat-lbl">Días hábiles (L–S)</div>
        </div>

        <div class="stat-box">
          <div class="stat-val green">${greenDays}</div>
          <div class="stat-lbl">Días perfectos (10/10)</div>
        </div>

        <div class="stat-box">
          <div class="stat-val ${longestStreak>=7?'green':longestStreak>=3?'amber':'red'}">${longestStreak}</div>
          <div class="stat-lbl">Racha más larga</div>
        </div>

        <div class="stat-box">
          <div class="stat-val amber">${amberDays}</div>
          <div class="stat-lbl">Días parciales (6–9)</div>
        </div>

        <div class="stat-box">
          <div class="stat-val red">${redDays+zeroDays}</div>
          <div class="stat-lbl">Días bajos (0–5)</div>
        </div>

        <div class="stat-box">
          <div class="stat-val">${totalArtists}</div>
          <div class="stat-lbl">Artistas contactados</div>
        </div>

        <div class="stat-box">
          <div class="stat-val">${avgArtistsPerWeek}</div>
          <div class="stat-lbl">Artistas / semana (prom)</div>
        </div>

        <div class="stat-box">
          <div class="stat-val ${pctPerfect>=50?'green':'amber'}">${pctPerfect}%</div>
          <div class="stat-lbl">% días perfectos</div>
        </div>

        <div class="stat-box">
          <div class="stat-val">${totalWeeks}</div>
          <div class="stat-lbl">Semanas analizadas</div>
        </div>

        <div class="stat-box full">
          <div class="stat-lbl" style="margin-bottom:10px">
            Actividades con más fallas
            <span style="font-size:9px;color:var(--ink3);font-weight:300;letter-spacing:.04em;text-transform:none;margin-left:6px">(diarias por día · semanales por semana)</span>
          </div>
          <div class="miss-list">
            ${allFails.map(f=>`
              <div class="miss-row">
                <div class="miss-name">${f.name}${f.tag?`<span style="font-size:9px;color:var(--amber);margin-left:5px;letter-spacing:.04em">·sem</span>`:''}</div>
                <div class="miss-bar-wrap"><div class="miss-bar" style="width:${f.pct}%"></div></div>
                <div class="miss-pct">${f.pct}%</div>
              </div>`).join('')}
          </div>
        </div>

        <div class="stat-box full">
          <div class="stat-lbl" style="margin-bottom:8px">Últimos ${last28.length} días hábiles</div>
          <div class="streak-dots">${dotHtml}</div>
          <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
            <div class="leg"><div class="leg-d" style="background:#AADBC0"></div>10/10</div>
            <div class="leg"><div class="leg-d" style="background:#E8C96A"></div>6–9</div>
            <div class="leg"><div class="leg-d" style="background:#F5A5A5"></div>1–5</div>
            <div class="leg"><div class="leg-d" style="background:var(--line)"></div>0</div>
          </div>
        </div>

      </div>
    </div>`;
}
